<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Na rozloučenou</title>
<style>
  :root{
    --bg:#15171B; --ink:#B9BEC7; --dim:#6E7480; --line:#2B2F37;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.15rem;line-height:1.7}
  main{max-width:760px;margin:0 auto;padding:3.5rem 1.25rem 4rem}
  h1{font-weight:400;font-style:italic;font-size:clamp(2rem,7vw,3rem);margin:0 0 .4rem;letter-spacing:.01em}
  h1 .w{white-space:nowrap}
  h1 .l{transition:color 2.4s ease}
  h1 .l.wet{color:#8fa8c8;transition-duration:.3s}
  .hint{margin:0 0 1.6rem;color:var(--dim);font-size:1rem}

  .stage{position:relative;width:100%;aspect-ratio:4/3;max-height:75vh;background:#0E0F12;overflow:hidden;cursor:pointer}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .9s,filter 2.6s ease;filter:grayscale(1) contrast(.9) brightness(.8)}
  .stage.dim img{filter:grayscale(1) contrast(.9) brightness(.5)}
  .stage img.on{opacity:1}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(0,0,0,.55)}
  .stage:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .missing{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;text-align:center;color:var(--dim);font-style:italic;z-index:1}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;color:var(--dim);font-size:1rem}
  .bar button{font:inherit;color:inherit;background:none;border:0;padding:.3rem .2rem;cursor:pointer}
  .bar button:hover{color:var(--ink)}
  .bar button:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
  .bar button:disabled{opacity:.3;cursor:default}

  /* vzkaz: skrytý, odkryje se až po kliknutí */
  .card{position:relative;margin-top:2.5rem;padding:1.8rem 1.5rem 1.2rem;visibility:hidden}
  .card.show{visibility:visible}
  .card::before,.card::after{content:"";position:absolute;left:50%;height:1px;width:0;background:var(--line);transform:translateX(-50%);transition:width 1.8s cubic-bezier(.2,.7,.2,1)}
  .card::before{top:0}
  .card::after{bottom:0;transition-delay:2.2s}
  .card.show::before,.card.show::after{width:100%}
  .card p{margin:0 0 .9rem}
  .card .greet{opacity:0;filter:blur(9px);letter-spacing:.55em;transition:opacity 1.8s .6s ease,filter 1.8s .6s ease,letter-spacing 2.6s .6s cubic-bezier(.2,.7,.2,1)}
  .card.show .greet{opacity:1;filter:blur(0);letter-spacing:.04em}
  .card .greet a{color:inherit;text-decoration:none}
  .card .greet a:hover{text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:.2em}
  .card .greet a:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .card .stone{opacity:0;transform:translateY(22px) scale(.88);filter:blur(7px) drop-shadow(0 0 0 rgba(185,190,199,0));transition:opacity 1.8s 1.9s ease,transform 2.2s 1.9s cubic-bezier(.2,.7,.2,1),filter 2.4s 1.9s ease}
  .card.show .stone{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 16px rgba(185,190,199,.28))}
  .card .sign{margin:1.4rem 0 0;color:var(--dim);font-style:italic}

  @media (prefers-reduced-motion:reduce){.stage img,.card::before,.card::after,.card .greet,.card .stone{transition:none!important}.card .greet{letter-spacing:.04em}.card .stone{transform:none}}
</style>
</head>
<body>
<main>
  <center><h1>Na rozloučenou</h1></center>

  <div class="stage" id="stage" tabindex="0" role="group" aria-label="Fotografie, klepnutím přejdete na další">
    <img src="foto.png" alt="Fotografie, první">
    <img src="vzpominka.png" alt="Fotografie, druhá">
    <div class="missing" id="missing"></div>
  </div>

  <div class="bar">
    <button type="button" id="prev" aria-label="Předchozí fotografie">zpět</button>
    <span id="count" aria-live="polite">1 / 2</span>
    <button type="button" id="next" aria-label="Další fotografie">dál</button>
  </div>

  <section class="card" id="card" aria-live="polite">
    <center>
      <p class="greet"><i>s pozdravem <a href="video.html">K. L.</a></i></p>
      <p class="stone">🪦</p>
      <p class="sign"></p>
    </center>
  </section>
</main>
<script>
(function(){
  var stage = document.getElementById('stage');
  var imgs = stage.querySelectorAll('img');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var count = document.getElementById('count');
  var card = document.getElementById('card');
  var missing = document.getElementById('missing');
  var i = 0;
  var revealed = false;

  function show(n){
    i = Math.max(0, Math.min(imgs.length - 1, n));
    imgs.forEach(function(im, k){ im.classList.toggle('on', k === i); });
    var last = i === imgs.length - 1;
    prev.disabled = i === 0;
    next.disabled = last && revealed;
    next.textContent = last && !revealed ? 'odkrýt' : 'dál';
    next.setAttribute('aria-label', last && !revealed ? 'Odkrýt vzkaz' : 'Další fotografie');
    count.textContent = (i + 1) + ' / ' + imgs.length;
    var broken = imgs[i].dataset.broken === '1';
    missing.style.display = broken ? 'flex' : 'none';
    missing.textContent = broken ? 'Sem přijde fotografie (soubor foto' + (i + 1) + '.jpg)' : '';
  }

  function reveal(){
    if (revealed) return;
    revealed = true;
    stage.classList.add('dim');
    card.classList.add('show');
    show(i);
    setTimeout(function(){ card.scrollIntoView({behavior:'smooth', block:'center'}); }, 500);
  }

  function advance(){
    if (i < imgs.length - 1) show(i + 1);
    else reveal();
  }

  imgs.forEach(function(im){
    im.addEventListener('error', function(){ im.dataset.broken = '1'; show(i); });
  });

  stage.addEventListener('click', advance);
  prev.addEventListener('click', function(){ show(i - 1); });
  next.addEventListener('click', advance);
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') advance();
  });
  stage.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); advance(); }
  });

  var x0 = null;
  stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40){ if (dx < 0) advance(); else show(i - 1); e.preventDefault(); }
    x0 = null;
  });

  show(0);
})();

/* kapající slzy z nadpisu */
(function(){
  var h1 = document.querySelector('h1');
  if (!h1) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // rozdělení nadpisu na písmena
  var text = h1.textContent.trim(), letters = [];
  h1.setAttribute('aria-label', text);
  h1.textContent = '';
  text.split(' ').forEach(function(word, wi){
    if (wi) h1.appendChild(document.createTextNode(' '));
    var w = document.createElement('span');
    w.className = 'w'; w.setAttribute('aria-hidden', 'true');
    word.split('').forEach(function(ch){
      var l = document.createElement('span');
      l.className = 'l'; l.textContent = ch; l._busy = 0; l._t = 0;
      w.appendChild(l); letters.push(l);
    });
    h1.appendChild(w);
  });

  // plátno přes celou obrazovku
  var cv = document.createElement('canvas');
  cv.setAttribute('aria-hidden', 'true');
  cv.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5';
  document.body.appendChild(cv);
  var ctx = cv.getContext('2d');
  if (!ctx) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0;
  function fit(){ W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  fit(); addEventListener('resize', fit);

  function rnd(a, b){ return a + Math.random() * (b - a); }
  var fs = parseFloat(getComputedStyle(h1).fontSize) || 40;
  var RM = Math.max(2.2, fs * .07);          // poloměr slzy
  var tears = [], fx = [], running = false, last = 0;

  function weep(l, delay){
    if (!l || l._busy >= 2 || tears.length > 40) return;
    l._busy++;
    tears.push({l:l, born:performance.now() + (delay || 0), dur:rnd(1000, 1700), ox:rnd(.28, .72), ph:0, started:false});
    ensure();
  }

  function drawDrop(x, cy, r, stretch, a){
    var h = r * (1.9 + stretch);
    ctx.beginPath();
    ctx.moveTo(x, cy - h);
    ctx.bezierCurveTo(x + r * .2, cy - h * .45, x + r, cy - r * .9, x + r, cy);
    ctx.arc(x, cy, r, 0, Math.PI, false);
    ctx.bezierCurveTo(x - r, cy - r * .9, x - r * .2, cy - h * .45, x, cy - h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150,190,235,' + (.5 * a) + ')';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(215,232,255,' + (.6 * a) + ')';
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x - r * .35, cy - r * .15, r * .22, r * .4, 0, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,' + (.65 * a) + ')';
    ctx.fill();
  }

  function ensure(){
    if (running) return;
    running = true; last = performance.now();
    requestAnimationFrame(frame);
  }

  function frame(now){
    var dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var st = document.getElementById('stage'), sr = st ? st.getBoundingClientRect() : null;
    var i, T, f;

    for (i = tears.length - 1; i >= 0; i--){
      T = tears[i];
      if (now < T.born) continue;
      if (!T.started){
        T.started = true;
        T.l.classList.add('wet');
        (function(l){ setTimeout(function(){ l.classList.remove('wet'); }, 1400); })(T.l);
      }
      if (T.ph === 0){                                   // slza narůstá na písmenu
        var rc = T.l.getBoundingClientRect();
        var x = rc.left + rc.width * T.ox, y0 = rc.top + rc.height * .8;
        var t = Math.min(1, (now - T.born) / T.dur), e = t * t * (3 - 2 * t);
        var r = RM * (.3 + .7 * e), stretch = 2.4 * t * t * t, h = r * (1.9 + stretch);
        drawDrop(x, y0 + h, r, stretch, Math.min(1, t * 4));
        if (t >= 1){
          T.ph = 1; T.x = x; T.y0 = y0; T.r = r; T.cy = y0 + h; T.vy = 40;
          T.end = sr ? sr.top + rnd(40, Math.max(41, Math.min(170, sr.height - 30))) : y0 + rnd(70, 140);
          T.end = Math.max(T.end, T.cy + 30);
          fx.push({k:'dot', x:x, y:y0, r:r * .35, born:now});
        }
      } else {                                           // pád
        T.vy += 1100 * dt; T.cy += T.vy * dt;
        var sx = Math.min(1.1, T.vy / 650), hh = T.r * (1.9 + sx);
        ctx.beginPath();
        ctx.moveTo(T.x, T.y0); ctx.lineTo(T.x, T.cy - hh);
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(180,210,245,.16)'; ctx.stroke();
        drawDrop(T.x, T.cy, T.r, sx, 1);
        if (T.cy + T.r >= T.end){                        // dopad
          fx.push({k:'ring', x:T.x, y:T.end, r:T.r, born:now});
          fx.push({k:'trail', x:T.x, y0:T.y0, y1:T.end - hh, born:now});
          for (var k = 0; k < 3; k++) fx.push({k:'p', x:T.x, y:T.end, vx:rnd(-60, 60), vy:rnd(-130, -60), born:now});
          T.l._busy--; tears.splice(i, 1);
        }
      }
    }

    for (i = fx.length - 1; i >= 0; i--){
      f = fx[i];
      var age = now - f.born, u;
      if (f.k === 'ring'){
        u = age / 700; if (u >= 1){ fx.splice(i, 1); continue; }
        var rx = f.r * (1 + 3.5 * u);
        ctx.beginPath(); ctx.ellipse(f.x, f.y, rx, rx * .3, 0, 0, 6.2832);
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(200,225,255,' + (.45 * (1 - u)) + ')'; ctx.stroke();
      } else if (f.k === 'dot'){
        u = age / 900; if (u >= 1){ fx.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832);
        ctx.fillStyle = 'rgba(170,205,245,' + (.5 * (1 - u)) + ')'; ctx.fill();
      } else if (f.k === 'trail'){
        u = age / 1800; if (u >= 1){ fx.splice(i, 1); continue; }
        ctx.beginPath(); ctx.moveTo(f.x, f.y0); ctx.lineTo(f.x, f.y1);
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(180,210,245,' + (.16 * (1 - u)) + ')'; ctx.stroke();
      } else {
        u = age / 520; if (u >= 1){ fx.splice(i, 1); continue; }
        f.vy += 600 * dt; f.x += f.vx * dt; f.y += f.vy * dt;
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.1, 0, 6.2832);
        ctx.fillStyle = 'rgba(200,225,255,' + (.6 * (1 - u)) + ')'; ctx.fill();
      }
    }

    if (tears.length || fx.length) requestAnimationFrame(frame);
    else running = false;
  }

  // interakce: přejetí kurzorem / prstem po písmenech
  function inBand(e){
    var hr = h1.getBoundingClientRect();
    return e.clientY >= hr.top - 8 && e.clientY <= hr.bottom + 8 && e.clientX >= hr.left - 8 && e.clientX <= hr.right + 8;
  }
  function letterAt(e){
    if (!inBand(e)) return -1;
    for (var k = 0; k < letters.length; k++){
      var r = letters[k].getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right) return k;
    }
    return -1;
  }
  document.addEventListener('pointermove', function(e){
    var k = letterAt(e), now = performance.now();
    if (k < 0 || now - letters[k]._t < 650) return;
    letters[k]._t = now;
    weep(letters[k], 0);
    if (Math.random() < .4 && letters[k + 1]) weep(letters[k + 1], rnd(150, 450));
    if (Math.random() < .4 && letters[k - 1]) weep(letters[k - 1], rnd(150, 450));
  });
  // klepnutí / kliknutí na nadpis: pláč ze všech písmen
  document.addEventListener('pointerdown', function(e){
    if (!inBand(e)) return;
    letters.forEach(function(l){ weep(l, rnd(0, 900)); });
  });

  // sem tam sama kápne
  (function ambient(){
    if (!document.hidden) weep(letters[Math.floor(Math.random() * letters.length)], 0);
    setTimeout(ambient, rnd(1500, 3600));
  })();
})();
</script>
</body>
</html>
