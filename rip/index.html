<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Na rozloučenou</title>
<style>
  :root{
    --bg:#15171B; --ink:#B9BEC7; --dim:#6E7480; --line:#2B2F37;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.15rem;line-height:1.7}
  main{max-width:760px;margin:0 auto;padding:3.5rem 1.25rem 4rem}
  h1{font-weight:400;font-style:italic;font-size:clamp(2rem,7vw,3rem);margin:0 0 .4rem;letter-spacing:.01em}
  .hint{margin:0 0 1.6rem;color:var(--dim);font-size:1rem}

  .stage{position:relative;width:100%;aspect-ratio:4/3;max-height:75vh;background:#0E0F12;overflow:hidden;cursor:pointer}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .9s;filter:grayscale(1) contrast(.9) brightness(.8)}
  .stage img.on{opacity:1}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(0,0,0,.55)}
  .stage:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .missing{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;text-align:center;color:var(--dim);font-style:italic;z-index:1}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;color:var(--dim);font-size:1rem}
  .bar button{font:inherit;color:inherit;background:none;border:0;padding:.3rem .2rem;cursor:pointer}
  .bar button:hover{color:var(--ink)}
  .bar button:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
  .bar button:disabled{opacity:.3;cursor:default}

  .card{margin-top:2.5rem;padding:1.6rem 1.5rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);opacity:0;transform:translateY(8px);transition:opacity 1.2s,transform 1.2s;visibility:hidden}
  .card.show{opacity:1;transform:none;visibility:visible}
  .card p{margin:0 0 .9rem}
  .card .sign{margin:1.4rem 0 0;color:var(--dim);font-style:italic}

  @media (prefers-reduced-motion:reduce){.stage img,.card{transition:none}.card{transform:none}}
</style>
</head>
<body>
<main>
  <center><h1>Na rozloučenou</h1></center>

  <div class="stage" id="stage" tabindex="0" role="group" aria-label="Fotografie, klepnutím přejdete na další">
    <img src="foto.png" alt="Fotografie, první">
    <img src="vzpominka.png" alt="Fotografie, druhá">
    <div class="missing" id="missing"></div>
  </div>

  <div class="bar">
    <button type="button" id="prev" aria-label="Předchozí fotografie">zpět</button>
    <span id="count" aria-live="polite">1 / 2</span>
    <button type="button" id="next" aria-label="Další fotografie">dál</button>
  </div>

  <section class="card" id="card" aria-live="polite">
    <center><p><i>s pozdravem K. L.</i></p></center>
    <center><p>🪦</p></center>
    <p class="sign"></p>
  </section>
</main>
<script>
(function(){
  var stage = document.getElementById('stage');
  var imgs = stage.querySelectorAll('img');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var count = document.getElementById('count');
  var card = document.getElementById('card');
  var missing = document.getElementById('missing');
  var i = 0;

  function show(n){
    i = Math.max(0, Math.min(imgs.length - 1, n));
    imgs.forEach(function(im, k){ im.classList.toggle('on', k === i); });
    prev.disabled = i === 0;
    next.disabled = i === imgs.length - 1;
    count.textContent = (i + 1) + ' / ' + imgs.length;
    card.classList.toggle('show', i === imgs.length - 1);
    var broken = imgs[i].dataset.broken === '1';
    missing.style.display = broken ? 'flex' : 'none';
    missing.textContent = broken ? 'Sem přijde fotografie (soubor foto' + (i + 1) + '.jpg)' : '';
  }

  imgs.forEach(function(im){
    im.addEventListener('error', function(){ im.dataset.broken = '1'; show(i); });
  });

  stage.addEventListener('click', function(){ show(i + 1); });
  prev.addEventListener('click', function(){ show(i - 1); });
  next.addEventListener('click', function(){ show(i + 1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });

  var x0 = null;
  stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40){ show(i + (dx < 0 ? 1 : -1)); e.preventDefault(); }
    x0 = null;
  });

  show(0);
})();
</script>
</body>
</html>
