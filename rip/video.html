<title>Když nasazení nestačí</title>
<style>
  :root{
    --bg:#15171B; --ink:#B9BEC7; --dim:#6E7480;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.15rem;line-height:1.7}
  main{max-width:760px;margin:0 auto;padding:3.5rem 1.25rem 4rem}
  h1{font-weight:400;font-style:italic;font-size:clamp(2rem,7vw,3rem);margin:0 0 1.6rem;letter-spacing:.01em;text-align:center}
  .video{display:block;width:100%;max-height:75vh;aspect-ratio:16/9;background:#0E0F12}
  .page-actions{display:flex;justify-content:space-between;align-items:flex-start;margin-top:1.2rem}
  .back{display:inline-flex;align-items:center;color:var(--dim);text-decoration:none;transition:color .2s ease}
  .back:hover{color:var(--ink)}
  .back:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .easter-egg{display:block;width:max-content;margin:2.5rem 0 0 auto;color:var(--dim);font-size:.72rem;opacity:.12;text-decoration:none;transition:opacity .2s ease}
  .easter-egg:hover,.easter-egg:focus-visible{opacity:1}
  .easter-egg:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .share{position:relative;color:var(--dim)}
  .share summary{display:flex;align-items:center;gap:.35rem;list-style:none;cursor:pointer;opacity:.5;transition:opacity .2s ease,color .2s ease}
  .share summary::-webkit-details-marker{display:none}
  .share summary:hover,.share summary:focus-visible,.share[open] summary{opacity:1;color:var(--ink)}
  .share summary:focus-visible{outline:2px solid var(--dim);outline-offset:4px}
  .share summary svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .share-menu{position:absolute;z-index:2;right:0;top:calc(100% + .5rem);min-width:10rem;padding:.35rem;background:#1c1f24;border:1px solid #2B2F37;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .share-menu a,.share-menu button{display:block;width:100%;padding:.4rem .55rem;border:0;background:none;color:var(--dim);font:inherit;font-size:.95rem;text-align:left;text-decoration:none;white-space:nowrap;cursor:pointer}
  .share-menu a:hover,.share-menu button:hover,.share-menu a:focus-visible,.share-menu button:focus-visible{color:var(--ink);background:#252930}
  .share-menu a[aria-disabled="true"],.share-menu button:disabled{opacity:.45;cursor:not-allowed}
  .easter-egg.runaway{position:fixed;z-index:5;margin:0;opacity:1;font-size:.85rem;padding:.3rem .5rem;transition:left .25s ease,top .25s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .egg-pop{max-width:20rem;padding:1.2rem 1.4rem;background:#1c1f24;color:var(--ink);border:1px solid #2B2F37;box-shadow:0 8px 24px rgba(0,0,0,.4);font-family:var(--serif);text-align:center}
  .egg-pop::backdrop{background:rgba(0,0,0,.55)}
  .egg-pop p{margin:0 0 1rem}
  .egg-pop a,.egg-pop button{display:inline-block;margin:0 .3rem;padding:.35rem .8rem;border:1px solid #2B2F37;background:none;color:var(--ink);font:inherit;font-size:.95rem;text-decoration:none;cursor:pointer}
  .egg-pop a:hover,.egg-pop button:hover{background:#252930}
  .share-status{margin:.5rem 0 0;color:var(--dim);font-size:.9rem;text-align:right}
</style>
</head>
<body>
<main>
  <h1></h1>
  <video class="video" controls playsinline preload="metadata" aria-label="Video vzpomínky">
    <source src="../lib/lv1qDLbRhp8QfCrD.mp4" type="video/mp4">
    Váš prohlížeč nepodporuje přehrávání videa.
  </video>
  <div class="page-actions">
    <a class="back" href="index.html" aria-label="Zpět na předchozí stránku">← zpět</a>
    <details class="share">
      <summary aria-label="Sdílet video" aria-controls="share-menu" title="Sdílet video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path></svg>
        <span>sdílet</span>
      </summary>
      <div class="share-menu" id="share-menu">
        <a data-share="facebook" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a data-share="whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a data-share="telegram" target="_blank" rel="noopener noreferrer">Telegram</a>
        <a data-share="x" target="_blank" rel="noopener noreferrer">X</a>
        <button type="button" id="copy-link">Discord – zkopírovat odkaz</button>
      </div>
    </details>
  </div>
  <p class="share-status" id="share-status" role="status" aria-live="polite"></p>
  <a class="easter-egg" href="https://gecka2026.github.io/lib/lv1qD3LbRhp8QfCrD.mp4" target="_blank" rel="noopener noreferrer" title="Tajný kaštanový východ — pro případ, že nasazení nestačí">L. K.?</a>
  <dialog class="egg-pop" id="egg-pop" aria-label="L. K.?">
    <p>L. K.?</p>
    <a id="egg-go" href="https://gecka2026.github.io/lib/lv1qD3LbRhp8QfCrD.mp4" target="_blank" rel="noopener noreferrer">pustit</a>
    <button type="button" id="egg-close">zavřít</button>
  </dialog>
</main>
<script>
(function(){
  var videoUrl = 'https://gecka2026.github.io/rip/video.html';
  var encodedUrl = encodeURIComponent(videoUrl);
  var encodedTitle = encodeURIComponent(document.title);
  var shareUrls = {
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl,
    whatsapp: 'https://api.whatsapp.com/send?text=' + encodedTitle + '%20' + encodedUrl,
    telegram: 'https://t.me/share/url?url=' + encodedUrl + '&text=' + encodedTitle,
    x: 'https://twitter.com/intent/tweet?url=' + encodedUrl + '&text=' + encodedTitle
  };
  document.querySelectorAll('[data-share]').forEach(function(link){
    link.href = shareUrls[link.dataset.share];
  });

  var share = document.querySelector('.share');
  var copyButton = document.getElementById('copy-link');
  var status = document.getElementById('share-status');
  copyButton.addEventListener('click', function(){
    if (!navigator.clipboard || !navigator.clipboard.writeText){
      status.textContent = 'Kopírování odkazu není v tomto prohlížeči dostupné.';
      return;
    }
    navigator.clipboard.writeText(videoUrl).then(function(){
      status.textContent = 'Odkaz na video zkopírován.';
      share.open = false;
    }).catch(function(){
      status.textContent = 'Odkaz se nepodařilo zkopírovat.';
    });
  });
})();
(function(){
  var pop = document.getElementById('egg-pop');
  var video = document.querySelector('.video');
  if (!pop || !pop.showModal) return;
  function show(){ if (!pop.open) pop.showModal(); }
  document.getElementById('egg-close').addEventListener('click', function(){ pop.close(); });
  document.getElementById('egg-go').addEventListener('click', function(){ pop.close(); });
  pop.addEventListener('click', function(e){ if (e.target === pop) pop.close(); });
  // Napsání „lk“ na klávesnici.
  var last = '';
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    last = (last + k).slice(-2);
    if (last === 'lk') show();
  });
  // Utíkající „L. K.?“ – uteče 2–3×, až pak doopravdy otevře video.
  var egg = document.querySelector('.easter-egg');
  if (egg){
    var need = 3 + Math.floor(Math.random() * 2); // 3. nebo 4. klik otevře video
    var clicks = 0;
    egg.addEventListener('click', function(e){
      clicks++;
      if (clicks >= need) { clicks = 0; need = 3 + Math.floor(Math.random() * 2); return; }
      e.preventDefault();
      var r = egg.getBoundingClientRect();
      var vw = window.innerWidth, vh = window.innerHeight, pad = 16;
      var maxX = Math.max(pad, vw - r.width - pad), maxY = Math.max(pad, vh - r.height - pad);
      var x, y, tries = 0;
      do {
        x = pad + Math.random() * (maxX - pad);
        y = pad + Math.random() * (maxY - pad);
        tries++;
      } while (tries < 20 && Math.abs(x - r.left) < vw * 0.25 && Math.abs(y - r.top) < vh * 0.25);
      if (!egg.classList.contains('runaway')){
        egg.style.left = r.left + 'px'; egg.style.top = r.top + 'px';
        egg.classList.add('runaway');
        void egg.offsetWidth;
      }
      egg.style.left = x + 'px'; egg.style.top = y + 'px';
    });
  }
  // 3× rychlé ťuknutí na video (mobil).
  var taps = [];
  if (video) video.addEventListener('pointerup', function(){
    var t = Date.now();
    taps = taps.filter(function(x){ return t - x < 800; });
    taps.push(t);
    if (taps.length >= 3){ taps = []; show(); }
  });
})();
</script>
</body>
</html>
