<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15171B">
<title>Na rozloučenou</title>
<script>
  var TARGET = "https://gecka2026.github.io/";
  window.location.replace(TARGET);
</script>
<noscript><meta http-equiv="refresh" content="0; url=hhttps://gecka2026.github.io/rip"></noscript>
<style>
  :root{--bg:#15171B;--ink:#B9BEC7;--dim:#6E7480;--line:#2B2F37}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;font-size:1.15rem;line-height:1.7;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
  main{max-width:26rem}
  h1{font-weight:400;font-style:italic;font-size:clamp(1.8rem,7vw,2.6rem);margin:0 0 1.2rem}
  p{margin:0 0 .5rem}
  .dim{color:var(--dim);font-size:1rem}
  a{color:var(--ink);text-underline-offset:.2em;text-decoration-color:var(--dim)}
  a:hover{text-decoration-color:var(--ink)}
  a:focus-visible{outline:2px solid var(--dim);outline-offset:3px}
  hr{border:0;border-top:1px solid var(--line);margin:1.6rem auto;width:4rem}
</style>
</head>
<body>
  <main>
    <h1>Na rozloučenou</h1>
    <p>Přesměrovávám…</p>
    <hr>
    <p class="dim">Pokud se nic nestalo, <a id="l" href="#">klepněte sem</a>.</p>
  </main>
  <script>document.getElementById('l').href = TARGET;</script>
</body>
</html>
